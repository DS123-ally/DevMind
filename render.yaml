services:
  - type: web
    name: devmind
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DEVMIND_HOST
        value: 0.0.0.0
      - key: DEVMIND_LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DEVMIND_CORS_ORIGINS
        sync: false
